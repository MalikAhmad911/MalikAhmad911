name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # color_dots: empty cell first, then levels 1-4; every level must stand out from the empty cell
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=githublight&color_snake=blueviolet&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#7c3aed
            dist/github-snake-dark.svg?palette=githubdark&color_snake=mediumseagreen&color_dots=#1e293b,#0e7490,#22d3ee,#a78bfa,#f0abfc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
