<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Ahmad Amir - Founder of Infinite Rankers LLC">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="80" height="30" width="22">
      <animate attributeName="width" begin="0.5s" dur="0.7s" fill="freeze" calcMode="discrete" values="22;33;44;55;66;77;88;110"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="40" y="160" height="30" width="22">
      <animate attributeName="width" begin="2.0s" dur="1.0s" fill="freeze" calcMode="discrete" values="22;33;44;55;66;77;88;99;110;121;132;143;154;165;185"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="40" y="240" height="30" width="22">
      <animate attributeName="width" begin="3.7s" dur="1.0s" fill="freeze" calcMode="discrete" values="22;33;44;55;66;77;88;99;110;121;132;143;154;165;185"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 18px; }
    .title { font-size: 14px; fill: #64748B; }
    .p { fill: #059669; font-weight: 700; }
    .cmd { fill: #0F172A; }
    .out { fill: #475569; }
    .hi { fill: #0891B2; font-weight: 700; }
    .vi { fill: #7C3AED; }
    .gr { fill: #059669; }
  </style>

  <!-- Window -->
  <rect x="20" y="20" width="1160" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M34 20 H1166 A14 14 0 0 1 1180 34 V60 H20 V34 A14 14 0 0 1 34 20 Z" fill="#E2E8F0"/>
  <rect x="20" y="59" width="1160" height="2" fill="url(#bar)" opacity="0.8"/>
  <circle cx="46" cy="40" r="7" fill="#F87171"/>
  <circle cx="70" cy="40" r="7" fill="#FBBF24"/>
  <circle cx="94" cy="40" r="7" fill="#34D399"/>
  <text x="600" y="45" text-anchor="middle" class="title">ahmad@infinite-rankers: ~</text>
  <text x="1160" y="45" text-anchor="end" class="title">Orlando, FL</text>

  <!-- 1: whoami -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0.4s" fill="freeze"/>
    <text x="40" y="100" clip-path="url(#c1)"><tspan class="p">$ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
    <text x="40" y="134"><tspan class="hi">Ahmad Amir</tspan><tspan class="out"> · Founder @ </tspan><tspan class="vi">Infinite Rankers LLC</tspan></text>
  </g>

  <!-- 2: focus -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>
    <text x="40" y="180" clip-path="url(#c3)"><tspan class="p">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
    <text x="40" y="214" class="out">SaaS products · CRMs · Email marketing · Full-stack <tspan class="hi">TypeScript</tspan></text>
  </g>

  <!-- 3: projects -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="3.6s" fill="freeze"/>
    <text x="40" y="260" clip-path="url(#c5)"><tspan class="p">$ </tspan><tspan class="cmd">ls ~/projects</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.4s" fill="freeze"/>
    <text x="40" y="294"><tspan class="hi">90min/</tspan><tspan class="out">   </tspan><tspan class="vi">crmdesignxyz/</tspan><tspan class="out">   </tspan><tspan class="gr">email-marketing/</tspan><tspan class="out">   </tspan><tspan class="hi">instagram/</tspan></text>
  </g>

  <!-- 4: idle prompt + cursor -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/>
    <text x="40" y="340"><tspan class="p">$ </tspan></text>
    <rect x="62" y="324" width="11" height="21" fill="#0891B2">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="5.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
